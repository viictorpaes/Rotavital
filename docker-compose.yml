services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rotavital-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - SUPABASE_DB_PASSWORD=${SUPABASE_DB_PASSWORD}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rotavital-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

