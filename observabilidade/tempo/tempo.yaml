# Grafana Tempo em modo single binary. Recebe os traces do backend por OTLP (HTTP 4318 e gRPC 4317)
# e guarda no disco do contêiner (volume dados-tempo).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

compactor:
  compaction:
    block_retention: 48h

usage_report:
  reporting_enabled: false
