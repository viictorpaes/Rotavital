# Prometheus do Rota Vital (RSD). Coleta pela rede interna do Docker: nenhum destes alvos tem porta
# publicada para fora, só o próprio Prometheus (9090, em localhost) e o Grafana.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend Spring Boot. O /actuator fica na porta de gerenciamento 8081, que só a rede do Docker alcança.
  - job_name: rotavital-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8081"]
        labels:
          ambiente: lab

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
