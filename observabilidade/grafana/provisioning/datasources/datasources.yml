# Datasources provisionados no Grafana: Prometheus (métricas), Loki (logs) e Tempo (traces).
# O "$$" escapa o "$" para o Grafana não tratar ${__value.raw} como variável de ambiente.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000
      # Do log para o trace: o backend escreve "[traceId=<id> spanId=<id>]" em cada linha.
      derivedFields:
        - name: traceId
          matcherRegex: "traceId=(\\w+)"
          url: "$${__value.raw}"
          datasourceUid: tempo
          urlDisplayLabel: Abrir o trace no Tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      # Do trace para os logs: busca no Loki as linhas daquele traceId, na aplicação do span.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        tags:
          - key: service.name
            value: application
      nodeGraph:
        enabled: true
      search:
        hide: false
