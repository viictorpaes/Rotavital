# ===================================================================
# Configuracao do Banco de Dados - Supabase (PostgreSQL Session Pooler)
# No docker compose, SPRING_DATASOURCE_URL/USERNAME/PASSWORD (variaveis de ambiente)
# sobrescrevem estes valores e apontam para o Postgres local do container "db".
# ===================================================================
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.gilyfswvezmvtmlxgvrd
# Senha lida automaticamente do arquivo .env (ou variavel de ambiente do sistema)
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Configuracao do Hibernate / JPA
# ===================================================================
# validate: o Hibernate só confere se as entidades batem com as tabelas; o schema vem das migrations (supabase/migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracao de CORS (Origens permitidas em Dev e Producao)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000,http://localhost}




# ===================================================================
# Porta e saude da aplicacao (Docker, Compose e Render)
# ===================================================================
# O Render informa a porta na variavel PORT; local e no Compose fica a 8080.
server.port=${PORT:8080}

# Expoe so health e info. O health tambem testa a conexao com o banco: fica DOWN se o Postgres cair.
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
# APP_VERSAO e o sha do commit gravado na imagem pela esteira (Dockerfile); o smoke test do deploy confere por ele.
info.app.nome=Rota Vital API
info.app.versao=${APP_VERSAO:local}
