# ===================================================================
# Configuracao do Banco de Dados - Supabase (PostgreSQL Session Pooler)
# No docker compose, SPRING_DATASOURCE_URL/USERNAME/PASSWORD (variaveis de ambiente)
# sobrescrevem estes valores e apontam para o Postgres local do container "db".
# ===================================================================
spring.datasource.url=jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.gilyfswvezmvtmlxgvrd
# Senha lida automaticamente do arquivo .env (ou variavel de ambiente do sistema)
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# PI3-308: sem conexão em 10 s, a chamada falha (e a API responde 503) em vez de ficar presa 30 s.
spring.datasource.hikari.connection-timeout=10000

# ===================================================================
# Configuracao do Hibernate / JPA
# ===================================================================
# validate: o Hibernate só confere se as entidades batem com as tabelas; o schema vem das migrations (supabase/migrations)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracao de CORS (Origens permitidas em Dev e Producao)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://localhost:3000,http://localhost}

# ===================================================================
# Supabase Auth - login com e-mail e senha (PI3-183)
# ===================================================================
# A chave publicável (sb_publishable_... ou a anon key antiga) fica no Supabase em Project Settings > API Keys.
supabase.url=${SUPABASE_URL:https://gilyfswvezmvtmlxgvrd.supabase.co}
supabase.publishable-key=${SUPABASE_KEY:}

# ===================================================================
# Google Maps Platform - Routes API: distancia e tempo ate o hospital da campanha (PI3-262)
# ===================================================================
# Chave do Google Cloud (APIs e servicos > Credenciais), restrita a "Routes API". Fica so no backend.
# Sem ela, POST /campanhas/{id}/rota responde com a estimativa em linha reta (fonte ESTIMATIVA).
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.routes.url=${GOOGLE_ROUTES_URL:https://routes.googleapis.com}

# ===================================================================
# Porta e saude da aplicacao (Docker, Compose e Render)
# ===================================================================
# O Render informa a porta na variavel PORT; local e no Compose fica a 8080.
spring.application.name=rotavital-backend
server.port=${PORT:8080}

# Expoe so health e info. O health tambem testa a conexao com o banco: fica DOWN se o Postgres cair.
# O compose da observabilidade (RSD) liga metrics e prometheus com ACTUATOR_EXPOSICAO e, com
# MANAGEMENT_SERVER_PORT=8081, tira o /actuator da porta publica: so a rede interna do Docker alcanca.
management.endpoints.web.exposure.include=${ACTUATOR_EXPOSICAO:health,info}
management.endpoint.health.show-details=never
# Tag usada nos filtros do Grafana: todas as metricas saem com application="rotavital-backend".
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Traces (OpenTelemetry -> Tempo): desligados por padrao para nao mudar nada no Render e nos testes.
management.tracing.enabled=${TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# O formato do traceId nos logs (LOGGING_PATTERN_CORRELATION) e definido no compose da observabilidade.
# Spans das consultas JDBC (datasource-micrometer): so no compose da observabilidade.
jdbc.datasource-proxy.enabled=${JDBC_OBSERVACAO:false}
management.info.env.enabled=true
# APP_VERSAO e o sha do commit gravado na imagem pela esteira (Dockerfile); o smoke test do deploy confere por ele.
info.app.nome=Rota Vital API
info.app.versao=${APP_VERSAO:local}
