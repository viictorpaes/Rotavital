openapi: 3.0.3

info:
  title: Rotavital API
  description: |
    Contratos REST do sistema **Rotavital**: estoque de hemocomponentes,
    requisições hospitalares, alocação por compatibilidade ABO/Rh e validade
    (FEFO), roteirização de entregas e telemetria da cadeia fria.

    **Base:** `http://localhost:8080/api/v1` (backend direto) ou
    `http://localhost/api/v1` (via Nginx).

    **Padrões REST**
    - Versionamento no caminho: `/api/v1/...`
    - Substantivos no plural, sem verbo na URL: `/requisicoes`, não `/criarRequisicao`
    - Sub-recursos por hierarquia: `/bancos/{bancoId}/estoque`, `/requisicoes/{id}/alocacoes`
    - Filtros e paginação na query string: `?tipoSanguineo=O_NEGATIVO&page=0&size=20`
    - Status: `201` ao criar, `204` ao excluir, `400` entrada inválida,
      `404` recurso inexistente, `422` regra de negócio violada
    - Erros no formato RFC 7807 (`application/problem+json`)

    **Autenticação:** `POST /acessos` confere e-mail e senha no Supabase Auth
    e devolve o perfil (MEDICO/DOADOR/ADMIN), a tela inicial e o token da
    sessão (PI3-183). Os demais endpoints ainda não exigem o token e não
    devolvem `403` por perfil: isso fica para a próxima sprint (decisão 6 de
    `docs/PERFIS_DE_ACESSO.md`).

    **Implementados hoje:** `acessos`, `bancos/{bancoId}/estoque`,
    `bancos/{bancoId}/estoque/resumo`, `GET hemocomponentes/{id}`, `pontos`,
    `conexoes`, `rotas` e `benchmarks`. Os demais (o resto de `hemocomponentes`,
    `requisicoes`, `entregas`) existem só no contrato e respondem `404` até
    ganharem controller.

    Documentação completa: `docs/CONTRATOS_DE_API.md`, seção 2.3
    "Endpoints REST do MVP, por recurso". Os schemas espelham o domínio Java
    em `com.rotavital.dominio`.
  version: "0.1.0"
  contact:
    name: Equipe Rotavital
    url: https://github.com/viictorpaes/Rotavital

tags:
  - name: Acesso
    description: Login com e-mail e senha (Supabase Auth) e tela inicial do perfil médico, doador ou admin (HU-01).
  - name: Estoque
    description: Consulta consolidada do estoque por banco de sangue.
  - name: Hemocomponentes
    description: CRUD e consulta das bolsas de hemocomponentes.
  - name: Requisicoes
    description: Recepção de pedidos hospitalares e algoritmo de alocação (FEFO/ABO-Rh).
  - name: Rotas
    description: Grafo de distribuição e cálculo de rota mínima com janela de tempo.
  - name: Telemetria
    description: Telemetria simulada da cadeia fria durante o transporte.
  - name: Benchmark
    description: Auditoria de telemetria sequencial x paralela (atividade de paralelismo).

servers:
  - url: http://localhost:8080/api/v1
    description: >
      Backend Spring Boot direto (mvn spring-boot:run ou docker compose up).
      Todos os controllers ficam sob /api/v1.
  - url: http://localhost/api/v1
    description: >
      Via proxy reverso do Nginx do frontend (docker compose up, container
      rotavital-frontend na porta 80), que repassa /api/* intacto ao backend -
      hoje sem uso real, a SPA ainda consome mocks locais.

paths:

  # -- Acesso --------------------------------------------------------------
  /acessos:
    post:
      tags: [Acesso]
      summary: Login com e-mail e senha; devolve o perfil e a tela inicial (HU-01)
      description: >
        Confere e-mail e senha no Supabase Auth e busca o perfil (papel) na
        tabela usuario, ligada a auth.users por auth_user_id. Devolve a rota da
        tela inicial, o menu e o token da sessão. Senha errada, e-mail sem
        cadastro e login sem linha em usuario respondem o mesmo 401, para não
        revelar quais e-mails existem. Por não criar recurso, responde 200
        (e não 201).
      operationId: entrar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoAcessoRequest' }
            example:
              email: ana.lima@rotavital.dev
              senha: "********"
      responses:
        '200':
          description: Login aceito, com o perfil, a tela inicial e o menu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Acesso' }
              examples:
                medico:
                  summary: Médico
                  value:
                    id: 3f1e2a9c-5b7d-4e8f-9a0b-1c2d3e4f5a6b
                    nome: Dra. Ana Lima
                    tipoAcesso: MEDICO
                    telaInicial: /painel
                    menu: [Início, Estoque, Requisição, Rede, Pacientes, Doações]
                    accessToken: eyJhbGciOiJIUzI1NiIs...
                    expiraEmSegundos: 3600
                doador:
                  summary: Doador
                  value:
                    id: 7a8b9c0d-1e2f-4a3b-8c4d-5e6f7a8b9c0d
                    nome: João Souza
                    tipoAcesso: DOADOR
                    telaInicial: /portal-doador
                    menu: []
                    accessToken: eyJhbGciOiJIUzI1NiIs...
                    expiraEmSegundos: 3600
                admin:
                  summary: Admin
                  value:
                    id: 0b1c2d3e-4f5a-4b6c-9d7e-8f9a0b1c2d3e
                    nome: Equipe Técnica
                    tipoAcesso: ADMIN
                    telaInicial: /admin
                    menu: [Início, Estoque, Requisição, Rede, Pacientes, Doações, Diagnóstico & Logs]
                    accessToken: eyJhbGciOiJIUzI1NiIs...
                    expiraEmSegundos: 3600
        '400':
          description: E-mail ou senha em branco, ou corpo que não é JSON.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Requisição inválida
                status: 400
                detail: "O campo 'email' é obrigatório. O campo 'senha' é obrigatório."
                instance: /api/v1/acessos
        '401':
          description: >
            E-mail ou senha não conferem. A mesma resposta vale para senha
            errada, e-mail sem cadastro e login sem linha em usuario.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Não autorizado
                status: 401
                detail: "E-mail ou senha incorretos."
                instance: /api/v1/acessos
        '503':
          description: Supabase Auth fora do ar ou chave do Supabase não configurada no backend.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Serviço indisponível
                status: 503
                detail: "Não foi possível conferir o login agora. Tente novamente em instantes."
                instance: /api/v1/acessos
        default:
          $ref: '#/components/responses/InternalServerError'

  # -- Estoque -----------------------------------------------------------
  /bancos/{bancoId}/estoque:
    get:
      tags: [Estoque]
      summary: Consulta o estoque consolidado de um banco de sangue
      description: >
        Sub-recurso singleton do banco de sangue (cada banco tem um único
        estoque). Retorna as bolsas vinculadas ao banco, opcionalmente
        filtradas por tipo sanguíneo.
      operationId: consultarEstoque
      parameters:
        - $ref: '#/components/parameters/BancoIdPath'
        - name: tipoSanguineo
          in: query
          schema: { $ref: '#/components/schemas/TipoSanguineo' }
      responses:
        '200':
          description: Estoque do banco informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estoque'
              example:
                bancoDeSangueId: BS-01
                totalBolsas: 1
                bolsas:
                  - id: BOLSA-001
                    tipoComponente: HEMACIAS
                    tipoSanguineo: O_POSITIVO
                    dataColeta: "2026-08-17"
                    dataValidade: "2026-09-26"
                    loteSintetico: LOTE-SIM-0001
                    volumeMl: 450.0
                    status: DISPONIVEL
                    bancoOrigemId: BS-01
        '400':
          description: tipoSanguineo fora da lista do enum.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Requisição inválida
                status: 400
                detail: "O parâmetro 'tipoSanguineo' não aceita o valor 'O-'. Valores aceitos: A_POSITIVO, A_NEGATIVO, B_POSITIVO, B_NEGATIVO, AB_POSITIVO, AB_NEGATIVO, O_POSITIVO, O_NEGATIVO."
                instance: /api/v1/bancos/BS-01/estoque
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalServerError'

  /bancos/{bancoId}/estoque/resumo:
    get:
      tags: [Estoque]
      summary: Totais do estoque por tipo sanguíneo e componente (tela inicial)
      description: >
        Conta as bolsas DISPONIVEL e dentro da validade de um banco de sangue,
        lendo as views do painel no Supabase (vw_estoque_por_tipo e
        vw_estoque_agrupado). Os 8 tipos sanguíneos e os 4 componentes sempre
        aparecem, inclusive zerados, na ordem dos enums. abaixoNivelSeguranca
        vem da view (menos de 10 unidades do tipo).
      operationId: resumirEstoque
      parameters:
        - $ref: '#/components/parameters/BancoIdPath'
      responses:
        '200':
          description: Totais do estoque do banco informado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumoEstoque'
              example:
                bancoDeSangueId: BS-01
                totalUnidades: 2
                tiposSanguineos:
                  # Os outros 7 tipos vêm na resposta zerados; ficaram de fora só para encurtar o exemplo.
                  - tipoSanguineo: O_NEGATIVO
                    unidades: 2
                    abaixoNivelSeguranca: true
                    componentes:
                      - { tipoComponente: HEMACIAS, unidades: 1 }
                      - { tipoComponente: PLASMA, unidades: 0 }
                      - { tipoComponente: PLAQUETAS, unidades: 0 }
                      - { tipoComponente: CRIOPRECIPITADO, unidades: 1 }
                componentes:
                  - { tipoComponente: HEMACIAS, unidades: 1 }
                  - { tipoComponente: PLASMA, unidades: 0 }
                  - { tipoComponente: PLAQUETAS, unidades: 0 }
                  - { tipoComponente: CRIOPRECIPITADO, unidades: 1 }
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalServerError'

  # -- Hemocomponentes -----------------------------------------------------
  /hemocomponentes:
    get:
      tags: [Hemocomponentes]
      summary: Lista bolsas de hemocomponentes com filtros
      description: Lista bolsas cadastradas, opcionalmente filtradas por banco, tipo de componente, tipo sanguíneo e status, da que vence primeiro para a que vence por último (FEFO).
      operationId: listarHemocomponentes
      parameters:
        - name: bancoId
          in: query
          schema: { type: string }
        - name: tipoComponente
          in: query
          schema: { $ref: '#/components/schemas/TipoComponente' }
        - name: tipoSanguineo
          in: query
          schema: { $ref: '#/components/schemas/TipoSanguineo' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusBolsa' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista de bolsas que atendem aos filtros.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BolsaHemocomponente' }
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Hemocomponentes]
      summary: Registra uma nova bolsa de hemocomponente no estoque
      description: >-
        Cria uma bolsa com status inicial DISPONIVEL, equivalente ao construtor de BolsaHemocomponente no domínio.
        O id é gerado pelo backend a partir da sigla do componente, seguindo o maior número já usado na faixa dele
        (HEMACIAS → CH-1001…CH-1999, PLASMA → PF-2001…PF-2999, PLAQUETAS → PQ-3001…PQ-3999,
        CRIOPRECIPITADO → CR-4001…CR-4999).
      operationId: criarHemocomponente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaBolsaHemocomponenteRequest' }
            example:
              tipoComponente: HEMACIAS
              tipoSanguineo: O_POSITIVO
              dataColeta: "2026-08-17"
              dataValidade: "2026-09-26"
              loteSintetico: LOTE-SIM-0001
              volumeMl: 450.0
              temperaturaCelsius: 4.0
              localizacao: "R1 · P3 · N2"
              bancoOrigemId: BS-01
      responses:
        '201':
          description: Bolsa criada com status inicial DISPONIVEL.
          headers:
            Location:
              description: Endereço da bolsa criada (ex.: /api/v1/hemocomponentes/CH-1091).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BolsaHemocomponente' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/InternalServerError'

  /hemocomponentes/{id}:
    get:
      tags: [Hemocomponentes]
      summary: Consulta uma bolsa pelo id
      description: Retorna os dados completos de uma bolsa de hemocomponente específica.
      operationId: obterHemocomponente
      parameters:
        - $ref: '#/components/parameters/BolsaIdPath'
      responses:
        '200':
          description: Bolsa encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BolsaHemocomponente' }
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Hemocomponentes]
      summary: Atualiza o status de uma bolsa (reservar, descartar, etc.)
      description: Aplica uma transição de status equivalente aos métodos reservar()/descartar() de BolsaHemocomponente no domínio.
      operationId: atualizarStatusHemocomponente
      parameters:
        - $ref: '#/components/parameters/BolsaIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarStatusBolsaRequest' }
            example: { status: RESERVADA }
      responses:
        '200':
          description: Bolsa atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BolsaHemocomponente' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Hemocomponentes]
      summary: Remove o cadastro de uma bolsa (ex. erro de lançamento)
      description: Remove definitivamente o registro de uma bolsa. Diferente de descartar (que é uma transição de status).
      operationId: removerHemocomponente
      parameters:
        - $ref: '#/components/parameters/BolsaIdPath'
      responses:
        '204':
          description: Bolsa removida.
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalServerError'

  # -- Requisições -----------------------------------------------------------
  /requisicoes:
    post:
      tags: [Requisicoes]
      summary: Recebe um novo pedido de hospital
      description: Cria uma requisição hospitalar com status inicial PENDENTE, equivalente a Hospital.solicitar(...) no domínio.
      operationId: criarRequisicao
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaRequisicaoRequest' }
            example:
              hospitalId: HOSP-01
              tipoComponente: HEMACIAS
              tipoSanguineo: O_POSITIVO
              quantidade: 1
              urgencia: ALTA
      responses:
        '201':
          description: Requisição criada com status PENDENTE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequisicaoHospitalar' }
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Requisicoes]
      summary: Lista requisições com filtros
      description: Lista requisições hospitalares, opcionalmente filtradas por hospital e status.
      operationId: listarRequisicoes
      parameters:
        - name: hospitalId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusRequisicao' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Lista de requisições.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RequisicaoHospitalar' }
        default:
          $ref: '#/components/responses/InternalServerError'

  /requisicoes/{id}:
    get:
      tags: [Requisicoes]
      summary: Consulta uma requisição pelo id
      description: Retorna os dados completos de uma requisição hospitalar específica.
      operationId: obterRequisicao
      parameters:
        - $ref: '#/components/parameters/RequisicaoIdPath'
      responses:
        '200':
          description: Requisição encontrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequisicaoHospitalar' }
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags: [Requisicoes]
      summary: Atualiza o status de uma requisição (ex. cancelar)
      description: >
        Transição de status da requisição. Cancelar é enviar
        status CANCELADA, equivalente a RequisicaoHospitalar.cancelar() no
        domínio - substitui o antigo POST /requisicoes/{id}/cancelar.
      operationId: atualizarStatusRequisicao
      parameters:
        - $ref: '#/components/parameters/RequisicaoIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarStatusRequisicaoRequest' }
            example: { status: CANCELADA }
      responses:
        '200':
          description: Requisição atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequisicaoHospitalar' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Transição de status inválida (ex. cancelar uma requisição já ENTREGUE).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Regra de negócio violada
                status: 422
                detail: "Requisição já ENTREGUE não pode ser cancelada."
                instance: /api/v1/requisicoes/9f1c1e7e-2d3a-4b1a-8a1e-000000000001
        default:
          $ref: '#/components/responses/InternalServerError'

  /requisicoes/{id}/alocacoes:
    post:
      tags: [Requisicoes]
      summary: Dispara o algoritmo de matching/alocação (compatibilidade ABO/Rh, priorização FEFO)
      description: >
        Busca bolsas compatíveis no estoque, prioriza a de vencimento mais
        próximo (FEFO - First Expired, First Out) e reserva-a para a requisição, equivalente ao fluxo
        Estoque.buscarDisponiveis(...) + BolsaHemocomponente.reservar()
        demonstrado em TesteFluxo. Cria o sub-recurso Alocacao (201) -
        substitui o antigo POST /requisicoes/{id}/alocar.
      operationId: alocarRequisicao
      parameters:
        - $ref: '#/components/parameters/RequisicaoIdPath'
      responses:
        '201':
          description: Bolsa compatível encontrada e reservada; requisição passa para ALOCADA.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alocacao' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: >
            Nenhuma bolsa compatível disponível no momento; requisição
            permanece PENDENTE (não é um erro de cliente, é regra de negócio).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Regra de negócio violada
                status: 422
                detail: "Nenhuma bolsa compatível (HEMACIAS/O_POSITIVO) disponível no estoque."
                instance: /api/v1/requisicoes/9f1c1e7e-2d3a-4b1a-8a1e-000000000001/alocacoes
        default:
          $ref: '#/components/responses/InternalServerError'

  # -- Rotas -----------------------------------------------------------------
  /pontos:
    get:
      tags: [Rotas]
      summary: Lista os nós do grafo de distribuição (hospitais e bancos de sangue)
      description: Retorna todos os pontos de rede (implementações de PontoDeRede no domínio) usados pelo algoritmo de roteirização.
      operationId: listarPontosRede
      responses:
        '200':
          description: Lista de pontos de rede.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PontoRede' }
        default:
          $ref: '#/components/responses/InternalServerError'

  /conexoes:
    get:
      tags: [Rotas]
      summary: Lista as conexões (arestas) do grafo de distribuição
      description: Retorna as conexões entre pontos de rede, com distância e tempo estimado, usadas pelo algoritmo de rota mínima.
      operationId: listarConexoesRede
      responses:
        '200':
          description: Lista de conexões entre pontos de rede.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conexao' }
        default:
          $ref: '#/components/responses/InternalServerError'

  /rotas:
    get:
      tags: [Rotas]
      summary: Calcula a rota de menor custo entre dois pontos, respeitando janela de tempo
      description: >
        Executa o algoritmo de menor caminho (Dijkstra) sobre o grafo de
        distribuição e avalia se o resultado cabe na janela de entrega
        informada. É uma consulta segura e idempotente (não grava nada), por
        isso GET com filtros na query string - substitui o antigo
        POST /rotas/calcular.
      operationId: calcularRota
      parameters:
        - name: origemId
          in: query
          required: true
          schema: { type: string }
          example: BS-01
        - name: destinoId
          in: query
          required: true
          schema: { type: string }
          example: HOSP-01
        - name: janelaEntregaLimite
          in: query
          required: false
          description: Limite ISO-8601 para a entrega; omitido, a rota é sempre considerada dentro da janela.
          schema: { type: string, format: date-time }
          example: "2026-08-22T21:00:00"
      responses:
        '200':
          description: Rota calculada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotaCalculada' }
        '400':
          description: origemId ou destinoId ausente.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Requisição inválida
                status: 400
                detail: "Informe origemId e destinoId na query string"
                instance: /api/v1/rotas
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Não existe caminho possível entre origem e destino no grafo.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                type: about:blank
                title: Regra de negócio violada
                status: 422
                detail: "Não existe caminho entre BS-01 e HOSP-01 no grafo de distribuição."
                instance: /api/v1/rotas
        default:
          $ref: '#/components/responses/InternalServerError'

  # -- Telemetria --------------------------------------------------------
  /entregas/{id}/leituras:
    post:
      tags: [Telemetria]
      summary: Registra uma leitura simulada de telemetria (localização e temperatura) de uma entrega
      description: >
        Ingesta uma leitura de telemetria da cadeia fria gerada por simulação
        (dados sintéticos) como sub-recurso da entrega em trânsito -
        substitui o antigo POST /telemetria/temperatura.
      operationId: registrarTelemetria
      parameters:
        - $ref: '#/components/parameters/EntregaIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrarTelemetriaRequest' }
            example:
              timestamp: "2026-08-22T18:32:00"
              latitude: -8.0510
              longitude: -34.8790
              temperaturaCelsius: 4.2
      responses:
        '201':
          description: Leitura registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeituraTelemetria' }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/InternalServerError'

    get:
      tags: [Telemetria]
      summary: Consulta o histórico de telemetria de uma entrega
      description: >
        Retorna todas as leituras de localização/temperatura já registradas
        para a entrega informada, em ordem cronológica - substitui o antigo
        GET /entregas/{id}/monitoramento.
      operationId: obterMonitoramentoEntrega
      parameters:
        - $ref: '#/components/parameters/EntregaIdPath'
      responses:
        '200':
          description: Histórico de leituras da entrega.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonitoramentoEntrega' }
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/InternalServerError'

  # -- Benchmark ---------------------------------------------------------
  /benchmarks/auditoria-telemetria:
    get:
      tags: [Benchmark]
      summary: Executa a auditoria de telemetria com parâmetros na query string
      description: >
        Gera uma massa sintética de leituras em memória e audita em modo
        sequencial e/ou paralelo, devolvendo tempos e speedup. Não persiste
        nada (por isso 200).
      operationId: executarBenchmarkViaGet
      parameters:
        - name: tamanho
          in: query
          schema: { type: integer, default: 100000, minimum: 1 }
        - name: modo
          in: query
          schema: { $ref: '#/components/schemas/ModoBenchmark' }
      responses:
        '200':
          description: Resultado da auditoria por modo de execução.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenchmarkResponse' }
        default:
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Benchmark]
      summary: Executa a auditoria de telemetria com parâmetros no corpo
      description: Mesmo processamento do GET, com os parâmetros em JSON. Não persiste nada (por isso 200).
      operationId: executarBenchmarkViaPost
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BenchmarkRequest' }
            example:
              quantidadeRegistros: 100000
              modo: TODOS
      responses:
        '200':
          description: Resultado da auditoria por modo de execução.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BenchmarkResponse' }
        default:
          $ref: '#/components/responses/InternalServerError'

components:

  # -- Parâmetros reutilizáveis ----------------------------------------------
  parameters:
    BancoIdPath:
      name: bancoId
      in: path
      required: true
      schema: { type: string }
      example: BS-01

    BolsaIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: BOLSA-001

    RequisicaoIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: 9f1c1e7e-2d3a-4b1a-8a1e-000000000001

    EntregaIdPath:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: ENT-001

    Page:
      name: page
      in: query
      description: Página (base 0).
      schema: { type: integer, minimum: 0, default: 0 }

    Size:
      name: size
      in: query
      description: Itens por página.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  # -- Schemas ---------------------------------------------------------------
  schemas:

    # ---- Enums ----
    TipoComponente:
      type: string
      enum: [HEMACIAS, PLASMA, PLAQUETAS, CRIOPRECIPITADO]

    TipoSanguineo:
      type: string
      enum:
        - A_POSITIVO
        - A_NEGATIVO
        - B_POSITIVO
        - B_NEGATIVO
        - AB_POSITIVO
        - AB_NEGATIVO
        - O_POSITIVO
        - O_NEGATIVO

    StatusBolsa:
      type: string
      enum: [DISPONIVEL, RESERVADA, EM_TRANSITO, ENTREGUE, DESCARTADA]

    StatusRequisicao:
      type: string
      enum: [PENDENTE, ALOCADA, EM_TRANSITO, ENTREGUE, CANCELADA]

    NivelUrgencia:
      type: string
      description: >
        Campo previsto pelo contrato de API (subtask "payloads com prioridade
        da requisição") mas ainda não existente em RequisicaoHospitalar no
        domínio Java - ver nota de gap em docs/CONTRATOS_DE_API.md.
      enum: [BAIXA, MEDIA, ALTA]

    TipoPontoRede:
      type: string
      enum: [HOSPITAL, BANCO_DE_SANGUE]

    TipoAcesso:
      type: string
      enum: [MEDICO, DOADOR, ADMIN]

    # ---- Acesso ----
    NovoAcessoRequest:
      type: object
      properties:
        email: { type: string, format: email, example: ana.lima@rotavital.dev }
        senha: { type: string, format: password }
      required: [email, senha]

    Acesso:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Id do usuário na tabela usuario.
        nome: { type: string, example: Dra. Ana Lima }
        tipoAcesso: { $ref: '#/components/schemas/TipoAcesso' }
        telaInicial:
          type: string
          description: "Rota do frontend: /painel (MEDICO), /portal-doador (DOADOR) ou /admin (ADMIN)."
          example: /painel
        menu:
          type: array
          items: { type: string }
          description: Itens de menu do perfil; vazio para DOADOR.
        accessToken:
          type: string
          description: Token da sessão do Supabase Auth. A API ainda não o exige nos outros endpoints.
        expiraEmSegundos:
          type: integer
          format: int64
          example: 3600
      required: [id, nome, tipoAcesso, telaInicial, menu, accessToken, expiraEmSegundos]

    # ---- Hemocomponentes / Estoque ----
    BolsaHemocomponente:
      type: object
      properties:
        id: { type: string, example: BOLSA-001 }
        tipoComponente: { $ref: '#/components/schemas/TipoComponente' }
        tipoSanguineo: { $ref: '#/components/schemas/TipoSanguineo' }
        dataColeta: { type: string, format: date }
        dataValidade: { type: string, format: date }
        loteSintetico:
          type: string
          description: Identifica o lote gerado para simulação com dados sintéticos.
          example: LOTE-SIM-0001
        volumeMl: { type: number, format: double }
        status: { $ref: '#/components/schemas/StatusBolsa' }
        bancoOrigemId: { type: string, example: BS-01 }
      required: [id, tipoComponente, tipoSanguineo, dataColeta, dataValidade, loteSintetico, volumeMl, status, bancoOrigemId]

    NovaBolsaHemocomponenteRequest:
      type: object
      properties:
        tipoComponente: { $ref: '#/components/schemas/TipoComponente' }
        tipoSanguineo: { $ref: '#/components/schemas/TipoSanguineo' }
        dataColeta: { type: string, format: date }
        dataValidade: { type: string, format: date }
        loteSintetico:
          type: string
          description: Identifica o lote gerado para simulação com dados sintéticos.
          example: LOTE-SIM-0001
        volumeMl:
          type: number
          format: double
          description: Maior que 0 e no máximo 700 ml.
        temperaturaCelsius:
          type: number
          format: double
          description: >-
            Temperatura medida na entrada da bolsa, entre -80 e 60 °C (faixa física do sensor). Fora da faixa
            ideal do componente a bolsa ainda entra, e aparece como alerta (foraDaFaixa).
        localizacao:
          type: string
          description: Onde a bolsa fica guardada. Opcional.
          example: "R1 · P3 · N2"
        bancoOrigemId: { type: string }
      required: [tipoComponente, tipoSanguineo, dataColeta, dataValidade, loteSintetico, volumeMl, temperaturaCelsius, bancoOrigemId]

    AtualizarStatusBolsaRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusBolsa' }
      required: [status]

    Estoque:
      type: object
      properties:
        bancoDeSangueId: { type: string }
        totalBolsas: { type: integer }
        bolsas:
          type: array
          items: { $ref: '#/components/schemas/BolsaHemocomponente' }
      required: [bancoDeSangueId, totalBolsas, bolsas]

    ResumoEstoque:
      type: object
      properties:
        bancoDeSangueId: { type: string }
        totalUnidades: { type: integer }
        tiposSanguineos:
          type: array
          description: Os 8 tipos sanguíneos, cada um dividido por componente.
          items: { $ref: '#/components/schemas/TotalPorTipoSanguineo' }
        componentes:
          type: array
          description: Total de cada componente somando todos os tipos.
          items: { $ref: '#/components/schemas/TotalPorComponente' }
      required: [bancoDeSangueId, totalUnidades, tiposSanguineos, componentes]

    TotalPorTipoSanguineo:
      type: object
      properties:
        tipoSanguineo: { $ref: '#/components/schemas/TipoSanguineo' }
        unidades: { type: integer }
        abaixoNivelSeguranca: { type: boolean }
        componentes:
          type: array
          items: { $ref: '#/components/schemas/TotalPorComponente' }
      required: [tipoSanguineo, unidades, abaixoNivelSeguranca, componentes]

    TotalPorComponente:
      type: object
      properties:
        tipoComponente: { $ref: '#/components/schemas/TipoComponente' }
        unidades: { type: integer }
      required: [tipoComponente, unidades]

    # ---- Requisições ----
    RequisicaoHospitalar:
      type: object
      properties:
        id: { type: string, format: uuid }
        hospitalId: { type: string, example: HOSP-01 }
        tipoComponente: { $ref: '#/components/schemas/TipoComponente' }
        tipoSanguineo: { $ref: '#/components/schemas/TipoSanguineo' }
        quantidade: { type: integer, minimum: 1 }
        urgencia: { $ref: '#/components/schemas/NivelUrgencia' }
        dataSolicitacao: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusRequisicao' }
      required: [id, hospitalId, tipoComponente, tipoSanguineo, quantidade, dataSolicitacao, status]

    NovaRequisicaoRequest:
      type: object
      properties:
        hospitalId: { type: string }
        tipoComponente: { $ref: '#/components/schemas/TipoComponente' }
        tipoSanguineo: { $ref: '#/components/schemas/TipoSanguineo' }
        quantidade: { type: integer, minimum: 1 }
        urgencia: { $ref: '#/components/schemas/NivelUrgencia' }
      required: [hospitalId, tipoComponente, tipoSanguineo, quantidade]

    AtualizarStatusRequisicaoRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/StatusRequisicao' }
      required: [status]

    Alocacao:
      type: object
      properties:
        requisicaoId: { type: string, format: uuid }
        bolsaAlocadaId: { type: string, example: BOLSA-001 }
        dataAlocacao: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/StatusRequisicao' }
      required: [requisicaoId, bolsaAlocadaId, dataAlocacao, status]

    # ---- Rotas ----
    PontoRede:
      type: object
      properties:
        id: { type: string }
        nome: { type: string }
        tipo: { $ref: '#/components/schemas/TipoPontoRede' }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
      required: [id, nome, tipo, latitude, longitude]

    Conexao:
      type: object
      properties:
        origemId: { type: string }
        destinoId: { type: string }
        distanciaKm: { type: number, format: double }
        tempoEstimadoMin: { type: number, format: double }
      required: [origemId, destinoId, distanciaKm, tempoEstimadoMin]

    RotaCalculada:
      type: object
      properties:
        origemId: { type: string }
        destinoId: { type: string }
        nos:
          type: array
          items: { type: string }
          description: Sequência de ids dos pontos de rede, na ordem da rota.
        distanciaTotalKm: { type: number, format: double }
        tempoEstimadoMin: { type: number, format: double }
        dentroDaJanela: { type: boolean }
      required: [origemId, destinoId, nos, distanciaTotalKm, tempoEstimadoMin]

    # ---- Telemetria ----
    RegistrarTelemetriaRequest:
      type: object
      description: O entregaId vem do caminho (/entregas/{id}/leituras), não do corpo.
      properties:
        timestamp: { type: string, format: date-time }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        temperaturaCelsius: { type: number, format: double }
      required: [timestamp, latitude, longitude, temperaturaCelsius]

    LeituraTelemetria:
      type: object
      properties:
        entregaId: { type: string }
        timestamp: { type: string, format: date-time }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        temperaturaCelsius: { type: number, format: double }
      required: [entregaId, timestamp, latitude, longitude, temperaturaCelsius]

    MonitoramentoEntrega:
      type: object
      properties:
        entregaId: { type: string }
        statusEntrega: { $ref: '#/components/schemas/StatusRequisicao' }
        leituras:
          type: array
          items: { $ref: '#/components/schemas/LeituraTelemetria' }
      required: [entregaId, statusEntrega, leituras]

    # ---- Benchmark ----
    ModoBenchmark:
      type: string
      enum: [TODOS, SEQUENCIAL, THREADS_2, THREADS_4, THREADS_8, VIRTUAL_THREADS]
      default: TODOS

    BenchmarkRequest:
      type: object
      properties:
        quantidadeRegistros: { type: integer, minimum: 1, default: 100000 }
        modo: { $ref: '#/components/schemas/ModoBenchmark' }

    ItemExecucao:
      type: object
      properties:
        modo: { type: string, example: THREADS_4 }
        threads: { type: integer }
        tempoExecucaoMs: { type: integer, format: int64 }
        speedup: { type: number, format: double }
        totalProcessado: { type: integer, format: int64 }
        anomaliasDetectadas: { type: integer, format: int64 }
        lotesCriticosDescarte: { type: integer, format: int64 }
        mediaTemperatura: { type: number, format: double }
        desvioPadraoTemperatura: { type: number, format: double }
        indiceDegradacaoMedio: { type: number, format: double }
      required: [modo, threads, tempoExecucaoMs, speedup, totalProcessado]

    BenchmarkResponse:
      type: object
      properties:
        tamanhoMassa: { type: integer }
        todosResultadosIdenticos: { type: boolean }
        mensagemConsistencia: { type: string }
        execucoes:
          type: array
          items: { $ref: '#/components/schemas/ItemExecucao' }
      required: [tamanhoMassa, todosResultadosIdenticos, mensagemConsistencia, execucoes]

    # ---- Erro (RFC 7807) ----
    Erro:
      type: object
      description: Problem Details for HTTP APIs (RFC 7807).
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance:
          type: string
          format: uri-reference
      required: [title, status]

  # -- Respostas de erro reutilizáveis ---------------------------------------
  responses:
    BadRequest:
      description: Requisição malformada (campo ausente, tipo inválido, etc.).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            type: about:blank
            title: Requisição inválida
            status: 400
            detail: "O campo 'quantidade' é obrigatório e deve ser maior que zero."
            instance: /api/v1/requisicoes

    NotFound:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            type: about:blank
            title: Recurso não encontrado
            status: 404
            detail: "Nenhuma bolsa encontrada com id BOLSA-999."
            instance: /api/v1/hemocomponentes/BOLSA-999

    UnprocessableEntity:
      description: Requisição bem formada, mas que viola uma regra de negócio do domínio.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            type: about:blank
            title: Regra de negócio violada
            status: 422
            detail: "Bolsa BOLSA-002 está vencida e não pode ser reservada."
            instance: /api/v1/hemocomponentes/BOLSA-002

    InternalServerError:
      description: Erro inesperado no servidor.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            type: about:blank
            title: Erro interno
            status: 500
            detail: "Ocorreu um erro inesperado ao processar a requisição."
            instance: /api/v1
